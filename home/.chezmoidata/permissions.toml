# Canonical read-only command/subcommand lists for Claude Code permissions.
#
# Consumed by home/dot_claude/settings.json.tmpl. Each base command's args are
# expanded across its heads: the vanilla form, the rtk-wrapped form (when rtk wraps
# it, per rtk_wraps), plus any extra_heads (git also gets `chezmoi git`). Add a
# read-only subcommand ONCE here and every wrapper form is granted in lockstep --
# this is what keeps rtk at 100% permission parity.
#
# A space before `*` is required for Claude Code prefix matching. A bare entry (no
# trailing ` *`) matches that exact invocation only; an empty string matches the
# bare command. List ONLY read-only, non-mutating, non-exfiltrating subcommands.
#
# Optional per-command keys, enforced at runtime by the permission-prefilter hook
# (home/dot_claude/hooks/) for every head form at once:
#   deny_flags  flags that block the command (`--flag`, `--flag=value`, and a
#               one-letter flag inside a cluster such as `-ao`)
#   ask_flags   flags that force a manual approval instead
#   env_allow   NAME = "regex" for allowed VAR= prefixes; any other prefix blocks
#   deny_args   static deny rules, generated for every head form like args
#   rtk_only    generate only the `rtk <cmd>` head (no plain command exists)
#
# A head must NEVER contain a wildcard. A head's text sits BEFORE the subcommand,
# and Claude Code matches these patterns as plain strings with no tokenisation, so
# a `*` there also matches the base command's own global options and pre-approves
# them. `git -C *` was removed for exactly this reason: it expanded to rules like
# `Bash(git -C * log *)`, which matches
#   git -C /repo -c core.pager=<cmd> log
# and runs <cmd> with no prompt. --exec-path and --upload-pack are the same
# hazard. Wildcards belong only AFTER the subcommand, in args.

[permissions]
# Base commands whose output rtk rewrites via its hook (source: `rtk --help`).
# Membership here grants a command its `rtk <cmd> ...` permission twin.
rtk_wraps = [
  "git",
  "gh",
  "glab",
  "aws",
  "psql",
  "pnpm",
  "find",
  "diff",
  "log",
  "dotnet",
  "docker",
  "kubectl",
  "oc",
  "grep",
  "rg",
  "wget",
  "wc",
  "ls",
  "tree",
  "du",
  "df",
  "ps",
  "read",
  "env",
  "jest",
  "vitest",
  "prisma",
  "tsc",
  "next",
  "lint",
  "prettier",
  "format",
  "playwright",
  "cargo",
  "npm",
  "npx",
  "curl",
  "ruff",
  "pytest",
  "mypy",
  "rake",
  "rubocop",
  "rspec",
  "pip",
  "go",
  "gt",
  "golangci-lint",
  "gradlew",
  "mvn",
]

# Settings for the permission-prefilter hook.
[permissions.hook]
# `cargo test|clippy|build|run|check` is auto-approved only under these roots.
trusted_dev_roots = ["~/git/nickvigilante", "~/rust"]

# Base command -> read-only arg patterns (everything after the command name).
# NOTE: scalar keys above must precede these sub-tables (TOML ordering rule).

[permissions.commands.git]
extra_heads = ["chezmoi git"]
deny_flags = [
  "--output",
  "--ext-diff",
  "--textconv",
  "--no-index",
  "--contents",
]
env_allow = { NO_COLOR = "1", GIT_PAGER = "cat" }
deny_args = ["branch -d *", "branch -D *", "branch --delete *"]
args = [
  "log *",
  "diff *",
  "show *",
  "status *",
  "blame *",
  "tag -l*",
  "tag",
  "remote -v",
  "remote show *",
  "remote get-url *",
  "ls-files *",
  "stash list *",
  "rev-parse *",
  "describe *",
  "worktree list *",
  "for-each-ref *",
  "shortlog *",
  "reflog show *",
  "reflog",
  "check-ignore *",
  "rev-list *",
]

[permissions.commands.gh]
args = [
  "pr list *",
  "pr view *",
  "pr diff *",
  "pr checks *",
  "pr status *",
  "issue list *",
  "issue view *",
  "issue status *",
  "run list *",
  "run view *",
  "workflow list *",
  "workflow view *",
  "repo view *",
  "repo list *",
  "release list *",
  "release view *",
  "auth status",
]

[permissions.commands.pnpm]
args = ["exec astro check *", "list *", "why *", "outdated *", "audit *"]

[permissions.commands.npm]
args = ["list *", "outdated *", "info *"]

[permissions.commands.cargo]
args = ["tree *", "metadata *", "search *"]
env_allow = { RUST_BACKTRACE = "0|1|full", RUST_LOG = "[A-Za-z0-9_=,:.-]+", CARGO_TERM_COLOR = "always|never|auto", NO_COLOR = "1" }

# Read-only tools. rtk rewrites the plain forms (`cat`/`head` become `rtk read`),
# so each needs its plain and rtk heads; deny_flags covers both.
[permissions.commands.ls]
args = ["", "*"]

[permissions.commands.tree]
args = ["", "*"]
deny_flags = ["-o", "-R"]

[permissions.commands.read]
rtk_only = true
args = ["*"]

[permissions.commands.grep]
args = ["*"]

[permissions.commands.rg]
args = ["*"]
deny_flags = ["--pre", "--pre-glob", "--hostname-bin"]

[permissions.commands.head]
args = ["*"]

[permissions.commands.wc]
args = ["*"]

[permissions.commands.diff]
args = ["*"]

[permissions.commands.du]
args = ["", "*"]

[permissions.commands.df]
args = ["", "*"]

[permissions.commands.ps]
args = ["", "*"]

[permissions.commands.chezmoi]
args = [
  "diff *",
  "status *",
  "data",
  "doctor",
  "verify *",
  "cat *",
  "managed *",
  "unmanaged *",
  "ignored *",
  "target-path *",
  "source-path *",
]
# --source is allowed only inside the dotfiles repo (checked by the hook).
deny_flags = [
  "--config",
  "-c",
  "--pager",
  "--output",
  "-o",
  "--persistent-state",
  "--cache",
  "--refresh-externals",
  "-R",
  "--destination",
  "-D",
  "--override-data-file",
  "--init",
  "--working-tree",
  "-W",
]
env_allow = { NO_COLOR = "1" }

