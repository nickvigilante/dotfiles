# --kubeconfig, --kube-apiserver and the KUBECONFIG=/HELM_* environment as for
# kubectl; --post-renderer runs a program; --output-dir and the cache options
# write files.
[permissions.commands.helm]
deny_flags = [
  "--kubeconfig",
  "--kube-apiserver",
  "--post-renderer",
  "--output-dir",
  "--content-cache",
  "--repository-cache",
]
args = [
  "version*",
  "env",
  "list*",
  "ls*",
  "status *",
  "history *",
  "get hooks *",
  "get notes *",
  "get metadata *",
  "repo list*",
  "search *",
  "dependency list *",
  "lint *",
  "template *",
  "plugin list",
]

# A formula or cask given as a path or URL is Ruby that brew would evaluate
# (current Homebrew refuses paths outside a tap, but HOMEBREW_DEVELOPER and
# older versions do not), and --eval-all evaluates every tapped formula.
[permissions.commands.brew]
deny_flags = ["--eval-all"]
deny_arg_patterns = ['(^|=)[./~]', '\.rb$', '://', '(^|/)\.\.(/|$)']
args = [
  "info *",
  "search *",
  "outdated",
  "deps *",
  "uses *",
  "leaves",
  "desc *",
  "doctor",
  "tap-info *",
  "list",
  "list *",
  "tap",
]

# `rustup show` runs the active toolchain's rustc, which a rust-toolchain.toml
# can point at any directory.
[permissions.commands.rustup]
trusted_roots_only = true
args = ["show", "target list", "toolchain list", "component list *", "check"]

# `rtk gain --reset` wipes the savings history. `rtk cc-economics` is not
# listed: it runs ccusage through npx, which fetches code from npm.
[permissions.commands.rtk]
deny_flags = ["--reset"]
args = ["gain *", "discover", "session *", "config show", "--version", "--help"]

[permissions.commands.sw_vers]
args = [""]

[permissions.commands.defaults]
args = ["read *"]

[permissions.commands.system_profiler]
args = ["*"]

[permissions.commands.mdls]
args = ["*"]
# -plist writes its output to a file.
deny_flags = ["-plist", "-p"]

[permissions.commands.plutil]
args = ["-p *"]

[permissions.commands.diskutil]
args = ["info *", "list"]

[permissions.commands.pkgutil]
args = ["--pkgs *", "--pkg-info *"]

[permissions.commands.xcode-select]
args = ["-p"]

[permissions.commands.launchctl]
args = ["list *"]

[permissions.commands.softwareupdate]
args = ["-l"]

[permissions.commands.duti]
args = ["-x *", "-l *"]

[permissions.commands.shellcheck]
args = ["*"]

# The report and diagnostics flags write files and --log-opts passes options
# to `git log`. `gitleaks git` runs git in the scanned repo, so the hook gives
# it the same repo-local config check as git itself.
[permissions.commands.gitleaks]
args = ["version", "git *"]
deny_flags = [
  "-r",
  "--report-path",
  "--log-opts",
  "--diagnostics",
  "--diagnostics-dir",
]

[permissions.commands.ffmpeg]
args = ["-version"]

# -o and -report write files; -f picks an input device such as lavfi, whose
# filters can write files, or a camera.
[permissions.commands.ffprobe]
args = ["*"]
deny_arg_patterns = ['^-(o|report|f|y)$']

[permissions.commands.cf-terraforming]
args = ["version"]

# `env` and `$ENV` print the environment (BW_SESSION and other secrets).
# -f, -L and import/include load jq code from files, which could do the same.
[permissions.commands.jq]
args = ["*"]
deny_flags = ["-f", "--from-file", "-L", "--library-path"]
deny_arg_patterns = [
  '(?<![\w.$])env\b',
  '\$\s*ENV\b',
  '(?<![\w.$])(import|include)\b',
]

[permissions.commands.stat]
args = ["*"]

[permissions.commands.file]
args = ["*"]
# -C compiles a magic file and writes the result next to it.
deny_flags = ["-C", "--compile"]

[permissions.commands.which]
args = ["*"]

[permissions.commands.tail]
args = ["*"]

[permissions.commands.date]
args = ["*"]
env_allow = { TZ = "[A-Za-z0-9_/+:-]+" }

[permissions.commands.echo]
args = ['"exit $?"', "exit $?", "$?"]

[permissions.commands.pwd]
args = [""]

[permissions.commands.true]
args = [""]

[permissions.commands.":"]
args = [""]
