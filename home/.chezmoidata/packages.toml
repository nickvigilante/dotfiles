# Single declaration of what software a machine gets.
#
# This is a generated target's data file, exactly like permissions.toml:
# edit here, never the rendered Brewfile.
#
# Ordering is significant — Go templates iterate a map in sorted key order,
# so packages are an ARRAY of tables to preserve the file's grouping.
#
# Channel fields (brew/cask/apt/cargo/go/uv/vscode/flatpak/npm) describe
# availability, not preference. A package with only `brew` is unavailable on
# the Pi, and the renderer says so rather than dropping it silently.
#
# Gating fields (profiles/os/secrets/machine) are each an optional array of
# permitted values; absent means unrestricted. A package may carry any
# combination of them — all that apply must pass for the entry to render.

