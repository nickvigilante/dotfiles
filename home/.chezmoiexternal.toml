# chezmoi manages Oh My ZSH and plugins as external git repos.
# `chezmoi update` will pull the latest commits per refreshPeriod.

[".oh-my-zsh"]
    type          = "git-repo"
    url           = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"   # pull weekly

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type          = "git-repo"
    url           = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type          = "git-repo"
    url           = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"

{{ if eq .profile "personal" -}}
# Requesty CLI — home machines only (profile "personal"), matches the
# gating used for the coder CLI in Brewfile.tmpl.
[".requesty/bin"]
    type          = "archive"
    url           = "https://github.com/requestyai/cli/releases/latest/download/requesty_{{ .chezmoi.os }}_{{ .chezmoi.arch }}.tar.gz"
    exact         = true
    refreshPeriod = "168h"
{{- end }}
