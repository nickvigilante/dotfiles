# Single source of truth for repo checks. CI runs `pre-commit run --all-files`.
# chezmoi note: never point a syntax parser at a raw .tmpl — see the
# chezmoi-render hook (added in a later task) for template validation.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Whitespace fixers stay off chezmoi templates: the template file is
      # rendered into the deployed file, so its whitespace is output.
      # Covers home/**/*.tmpl and the files chezmoi templates without a
      # .tmpl suffix (.chezmoiignore, .chezmoiremove, .chezmoiexternal.*).
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &chezmoi_templates '^home/(.*\.tmpl|\.chezmoi(ignore|remove|external\.[a-z]+))$'
      - id: end-of-file-fixer
        exclude: *chezmoi_templates
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *chezmoi_templates
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-json
        exclude: '\.tmpl$'
      - id: check-toml
        # .chezmoiexternal.toml is templated by chezmoi despite its plain name.
        exclude: '(\.tmpl$|^home/\.chezmoiexternal\.toml$)'
      - id: check-yaml
        exclude: '\.tmpl$'
      - id: detect-private-key
  # The repo is public, so scan for committed secrets.
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.3.1
    hooks:
      - id: betterleaks
